<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="80" height="80" rx="20" fill="url(#g1)"/>
  <rect width="80" height="80" rx="20" fill="white" opacity="0.06"/>

  <!-- Bold C -->
  <path d="M 56 18 A 24 24 0 1 0 56 62 L 56 54 A 16 16 0 1 1 56 26 Z"
        fill="white" opacity="0.95" filter="url(#glow)"/>

  <!-- Spark dots -->
  <circle cx="57" cy="40" r="3.5" fill="white" opacity="0.9"/>
  <circle cx="64" cy="34" r="2"   fill="white" opacity="0.55"/>
  <circle cx="67" cy="40" r="1.5" fill="white" opacity="0.35"/>
  <circle cx="64" cy="46" r="2"   fill="white" opacity="0.55"/>
</svg>
