<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <!-- Main brand gradient purple → blue -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Icon clip circle -->
    <clipPath id="iconClip">
      <rect x="0" y="0" width="80" height="80" rx="20"/>
    </clipPath>
  </defs>

  <!-- ── Icon background rounded square ── -->
  <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#brandGrad)"/>

  <!-- Subtle inner glow overlay -->
  <rect x="0" y="0" width="80" height="80" rx="20" fill="white" opacity="0.06"/>

  <!-- ── Letter C (bold, modern, open arc) ── -->
  <!-- Outer arc of C -->
  <path d="M 56 18
             A 24 24 0 1 0 56 62
             L 56 54
             A 16 16 0 1 1 56 26
             Z"
        fill="white" opacity="0.95" filter="url(#glow)"/>

  <!-- ── Spark / star accent inside the C opening ── -->
  <circle cx="57" cy="40" r="3.5" fill="white" opacity="0.9"/>
  <!-- small dot trail -->
  <circle cx="64" cy="34" r="2"   fill="white" opacity="0.55"/>
  <circle cx="67" cy="40" r="1.5" fill="white" opacity="0.35"/>
  <circle cx="64" cy="46" r="2"   fill="white" opacity="0.55"/>

  <!-- ── Wordmark: "Creavo" ── -->
  <!-- "Cr" in white -->
  <text x="94" y="52"
        font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="32" font-weight="800" letter-spacing="-1"
        fill="white">Cr</text>

  <!-- "eavo" in gradient -->
  <text x="134" y="52"
        font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="32" font-weight="800" letter-spacing="-1"
        fill="url(#brandGrad)">eavo</text>

  <!-- Tagline -->
  <text x="95" y="68"
        font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="10.5" font-weight="500" letter-spacing="2.5"
        fill="#94a3b8">CREATIVE MARKETPLACE</text>
</svg>
